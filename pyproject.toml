[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-test-runner"
version = "1.0.0"
description = "External conformance and regression runner for Studio V5 distributions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Luiz J. R. Lopes"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
studio-test-runner = "studio_test_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
